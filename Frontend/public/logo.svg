<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- AI Accent Gradient (Cyan to Purple) -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Waveform Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Speech Bubble / AI Node Ring -->
  <path d="M 256 96 
           C 344 96, 416 168, 416 256 
           C 416 344, 344 416, 256 416 
           C 220 416, 187 404, 160 384 
           L 104 400 
           L 124 348 
           C 104 322, 96 290, 96 256 
           C 96 168, 168 96, 256 96 Z" 
        fill="none" 
        stroke="url(#aiGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- AI Neural Network Nodes on the Speech Bubble Frame -->
  <circle cx="256" cy="96" r="12" fill="#06B6D4" />
  <circle cx="416" cy="256" r="12" fill="#3B82F6" />
  <circle cx="160" cy="384" r="10" fill="#8B5CF6" />
  <circle cx="96" cy="256" r="12" fill="#06B6D4" />

  <!-- Audio Waveform / Voice AI Bars (Center) -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="180" y="226" width="18" height="60" rx="9" fill="url(#aiGrad)" />
    <!-- Bar 2 (Taller) -->
    <rect x="218" y="186" width="18" height="140" rx="9" fill="url(#aiGrad)" />
    <!-- Bar 3 (Center Peak) -->
    <rect x="256" y="156" width="18" height="200" rx="9" fill="url(#aiGrad)" />
    <!-- Bar 4 (Taller) -->
    <rect x="294" y="186" width="18" height="140" rx="9" fill="url(#aiGrad)" />
    <!-- Bar 5 -->
    <rect x="332" y="226" width="18" height="60" rx="9" fill="url(#aiGrad)" />
  </g>
</svg>
